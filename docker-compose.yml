services:
  postgres:
    image: postgres:15-alpine
    container_name: yuma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuma
      POSTGRES_PASSWORD: yuma_secret
      POSTGRES_DB: yuma_db
      # منطقه زمانی و کدگذاری فارسی
      TZ: Asia/Tehran
      PGTZ: Asia/Tehran
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - yuma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuma -d yuma_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Tehran
    ports:
      - "6379:6379"
    volumes:
      - yuma-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: yuma-mailhog
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # رابط وب

  minio:
    image: minio/minio:latest
    container_name: yuma-minio
    restart: unless-stopped
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yuma
      MINIO_ROOT_PASSWORD: yuma-secret
      TZ: Asia/Tehran
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yuma-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  yuma-postgres-data:
  yuma-redis-data:
  yuma-minio-data:
